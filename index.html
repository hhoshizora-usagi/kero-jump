<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#deedcf">
<title>ケロの空中遺跡 🐸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ケロの空中遺跡 — ブラッシュアップ版 v1.1.0
   ルール（自動ジャンプ・左右移動・動く足場・壊れる足場・落下で終了）は従来どおり。
   見た目・アニメーション・画面サイズ対応を作り直し。
   ========================================================= */
:root{
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Segoe UI',sans-serif;
  background:#12202c;display:flex;align-items:center;justify-content:center}
.wrap{position:relative;line-height:0}
canvas{display:block;touch-action:none;border-radius:14px;box-shadow:0 18px 46px rgba(0,0,0,.5)}

.hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;line-height:1.2}
.hud-left{display:flex;flex-direction:column;gap:1px}
.score{font-size:clamp(22px,5vmin,30px);font-weight:900;color:#fff;letter-spacing:.02em;
  text-shadow:0 2px 0 rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.score small{font-size:.42em;font-weight:800;color:#cfeeff;margin-right:4px;letter-spacing:.1em}
.lesson{font-size:10.5px;font-weight:800;color:#d8f0ff;text-shadow:0 1px 0 rgba(0,0,0,.45);
  background:rgba(20,50,80,.28);padding:2px 8px;border-radius:999px;align-self:flex-start}
.best{font-size:11px;font-weight:800;color:#ffe082;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.milestone{position:absolute;left:50%;top:22%;transform:translateX(-50%);pointer-events:none;
  font-weight:900;font-size:clamp(16px,4.6vmin,24px);color:#fff;-webkit-text-stroke:5px #43a047;
  paint-order:stroke fill;opacity:0;white-space:nowrap}
.milestone.show{animation:msPop 1.1s ease-out}
@keyframes msPop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-34px) scale(.95)}}

.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,18,28,.6);backdrop-filter:blur(3px);border-radius:14px;line-height:1.5;
  padding:calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l))}
.overlay.show{display:flex;animation:fadeIn .22s ease-out}
@keyframes fadeIn{from{opacity:0}}
.panel{position:relative;width:min(100%,300px);max-height:100%;overflow:auto;background:#f2fbf0;
  border-radius:22px;padding:20px 22px;text-align:center;box-shadow:0 8px 0 #cfe3c8,0 20px 38px rgba(0,0,0,.35);
  animation:panelIn .4s cubic-bezier(.3,1.5,.5,1);overflow:hidden}
@keyframes panelIn{from{transform:translateY(24px) scale(.92);opacity:0}}
.panel h2{font-size:clamp(21px,5.4vmin,27px);font-weight:900;color:#2e7d32;letter-spacing:.03em}
.panel .lead{font-size:12.5px;font-weight:700;color:#7e9a78;margin:5px 0 10px;line-height:1.75}
.rules{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 0 12px;text-align:left}
.rules li{background:#fff;border-radius:10px;padding:5px 7px;font-size:11px;font-weight:700;color:#5f7a58;
  box-shadow:0 2px 0 #e2efdd;display:flex;gap:5px;align-items:center}
.rules li i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:11px 26px;font-size:15px;font-weight:900;letter-spacing:.05em;color:#fff;
  background:linear-gradient(180deg,#7ed957,#43a047);box-shadow:0 5px 0 #2e7d32;transition:transform .1s,box-shadow .1s;
  text-decoration:none;display:inline-block}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2e7d32}
.btn.sub{background:linear-gradient(180deg,#fff,#eef7ec);color:#5f7a58;box-shadow:0 5px 0 #d3e6cd}
.btn.sub:active{box-shadow:0 1px 0 #d3e6cd}
.big{font-size:clamp(34px,9.4vmin,48px);font-weight:900;color:#43a047;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:.35em;color:#93b08c;margin-left:3px}
.rank{display:inline-block;margin:5px 0 12px;padding:5px 14px;border-radius:999px;font-weight:900;font-size:13px;
  background:linear-gradient(180deg,#ffe9a8,#ffd257);color:#8a5c00;box-shadow:0 3px 0 #dfae2b}
.rank.pop{animation:rankPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes rankPop{from{transform:scale(0) rotate(-10deg)}}
.stats3{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin:2px 0 12px}
.stats3 div{background:#f3fbf1;border-radius:10px;padding:5px 3px;box-shadow:0 2px 0 #e2efdd}
.stats3 small{display:block;font-size:9.5px;font-weight:800;color:#93b08c}
.stats3 b{font-size:15px;font-weight:900;color:#5f7a58}
.newbest{position:absolute;top:12px;right:-40px;transform:rotate(35deg);background:#ff7043;color:#fff;
  font-weight:900;font-size:11px;padding:4px 46px;display:none;line-height:1.4}
.newbest.show{display:block}
@media (max-height:520px){ .rules{grid-template-columns:repeat(4,1fr)} .panel{padding:14px 16px} }
@media (prefers-reduced-motion:reduce){ .panel,.rank{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="400" height="600"></canvas>

  <div class="hud">
    <div class="hud-left">
      <div class="score"><small>HEIGHT</small><span id="score">0</span></div>
      <span class="lesson" id="lesson">左右移動を学ぼう</span>
    </div>
    <div class="best" id="best">🏆 --</div>
  </div>

  <div class="milestone" id="milestone"></div>

  <div class="overlay show" id="menu">
    <div class="panel">
      <h2>ケロの空中遺跡</h2>
      <p class="lead">左右移動、動く足場、壊れる足場を<br>順番に覚えて、上をめざそう！</p>
      <ul class="rules">
        <li><i style="background:#66bb6a"></i>緑はふつうの足場</li>
        <li><i style="background:#42a5f5"></i>青は動く足場</li>
        <li><i style="background:#ffb74d"></i>橙は一度だけ</li>
        <li><i style="background:#ef5350"></i>落ちたら終了</li>
      </ul>
      <div class="btns"><button class="btn" id="go">スタート！</button></div>
    </div>
  </div>

  <div class="overlay" id="over">
    <div class="panel">
      <div class="newbest" id="newbest">NEW BEST!</div>
      <h2>おちちゃった！</h2>
      <div class="big"><span id="ov-score">0</span><small>点</small></div>
      <div class="rank" id="ov-rank"></div>
      <div class="stats3">
        <div><small>ベスト</small><b id="ov-best">--</b></div>
        <div><small>最高到達</small><b id="ov-max">0</b></div>
      </div>
      <div class="btns">
        <button class="btn" id="retry">もう一回！</button>
        <a class="btn sub" id="backlink" href="https://hhoshizora-usagi.github.io/game-room/">一覧へ</a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var W = 400, H = 600;
  var cv = document.getElementById('c'), X = cv.getContext('2d');
  var $ = function(id){ return document.getElementById(id); };

  var embedded = false;
  try{ embedded = window.self !== window.top; }catch(e){ embedded = true; }
  if(embedded){ $('backlink').style.display = 'none'; }

  // ===== 設定（ルールは従来どおり） =====
  var BEST_KEY = 'kero-jump-v4';
  var GAP = 55;                       // 足場の間隔
  var CENTERS = [
    [200,140,200,260,200,140],
    [140,140,210,210,260,210],
    [210,150,210,270,210,150]
  ];

  var state = 'menu';
  var player, platforms, platformIndex, scrollY, score, maxScore, particles, t;
  var lesson = '左右移動を学ぼう';
  var best = 0;
  try{ best = parseInt(localStorage.getItem(BEST_KEY),10) || 0; }catch(e){ best = 0; }
  $('best').textContent = best > 0 ? ('🏆 ' + best) : '🏆 --';

  // ===== 音 =====
  var muted = false, actx = null;
  function audio(){
    if(muted) return null;
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, to){
    var a = audio(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain(), now = a.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, now);
    if(to) o.frequency.exponentialRampToValueAtTime(to, now + dur);
    g.gain.setValueAtTime(vol || .1, now);
    g.gain.exponentialRampToValueAtTime(.001, now + dur);
    o.connect(g); g.connect(a.destination); o.start(now); o.stop(now + dur + .02);
  }
  var sfx = {
    boing: function(){ tone(300, .1, 'sine', .06, 620); },
    crack: function(){ tone(420, .09, 'square', .05, 180); },
    fall:  function(){ tone(360, .4, 'sine', .1, 80); },
    miles: function(){ tone(720, .1, 'triangle', .08); setTimeout(function(){ tone(1080,.16,'triangle',.08); }, 90); }
  };

  // ===== 初期化 =====
  function reset(){
    player = { x: W/2, y: H-80, vy: 0, onGround: false, squash: 0 };
    platforms = []; platformIndex = 0; scrollY = 0; score = 0; maxScore = 0;
    particles = []; t = 0;
    platforms.push({ x: W/2-40, y: H-40, w: 80, type:'normal', phase:0, broken:false });
    for(var i=1;i<12;i++) addPlatform(H-40-i*GAP);
    player.vy = -8;
    $('score').textContent = '0';
    $('lesson').textContent = '左右移動を学ぼう';
  }

  function addPlatform(y){
    var i = platformIndex++, phase = Math.floor(i/6)%3, slot = i%6;
    var center = CENTERS[phase][slot];
    var type = (phase===1 && slot%3===2) ? 'moving' : ((phase===2 && slot%3!==0) ? 'breakable' : 'normal');
    platforms.push({ x: center-40, baseX: center-40, y: y, w: 80, type: type,
      dir: 1, broken: false, phase: phase });
  }

  function jump(){
    player.vy = -8.5 - Math.min(score/800, 2);
    player.squash = 1;
    sfx.boing();
    for(var i=0;i<6;i++){
      particles.push({ x: player.x, y: player.y+12, vx:(Math.random()-.5)*3, vy: Math.random()*2,
        life:14, r:2+Math.random()*3, color:'#c8ed89' });
    }
  }

  // ===== 入力 =====
  var moveDir = 0, touchX = null, dragDelta = 0, pointerActive = false;
  cv.addEventListener('pointerdown', function(e){
    e.preventDefault();
    pointerActive = true; touchX = e.clientX; dragDelta = 0;
    if(state !== 'play') start();
  });
  cv.addEventListener('pointermove', function(e){
    if(!pointerActive || state !== 'play') return;
    var r = cv.getBoundingClientRect();
    dragDelta += (e.clientX - touchX) / r.width * W;
    touchX = e.clientX;
  });
  window.addEventListener('pointerup', function(){ pointerActive = false; touchX = null; dragDelta = 0; });
  document.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); if(state !== 'play') start(); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); moveDir = -1; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); moveDir = 1; }
  });
  document.addEventListener('keyup', function(e){
    if(e.key === 'ArrowLeft' && moveDir === -1) moveDir = 0;
    if(e.key === 'ArrowRight' && moveDir === 1) moveDir = 0;
  });

  // ===== 描画 =====
  function skyColors(progress){
    // 0 = 昼の青、0.5 = 夕暮れ、1 = 星空
    var a = [[110,198,255],[255,170,120],[22,30,70]];
    var b = [[179,229,252],[255,215,170],[48,58,120]];
    var c = [[200,230,201],[255,235,200],[90,110,170]];
    function lerp(p, i){
      if(p < 0.5){ var k = p/0.5; return a[i].map(function(v,j){ return Math.round(v + (b[i][j]-v)*k); }); }
      var k2 = (p-0.5)/0.5; return b[i].map(function(v,j){ return Math.round(v + (c[i][j]-v)*k2); });
    }
    return [lerp(progress,0), lerp(progress,1), lerp(progress,2)];
  }
  function rgb(v){ return 'rgb('+v[0]+','+v[1]+','+v[2]+')'; }

  function drawBg(){
    var progress = Math.min((score||0)/900, 1);
    var col = skyColors(progress);
    var g = X.createLinearGradient(0,0,0,H);
    g.addColorStop(0, rgb(col[0])); g.addColorStop(.65, rgb(col[1])); g.addColorStop(1, rgb(col[2]));
    X.fillStyle = g; X.fillRect(0,0,W,H);

    // 遠くの雲（パララックス）
    X.fillStyle = 'rgba(255,255,255,' + (0.5 - progress*0.28) + ')';
    var off = (scrollY*0.12) % 220;
    for(var i=0;i<4;i++){
      var cy = ((i*220 - off) % (H+220) + H+220) % (H+220) - 110;
      var cx = (i*97 % W);
      X.beginPath();
      X.arc(cx, cy, 26, 0, Math.PI*2);
      X.arc(cx+30, cy+6, 20, 0, Math.PI*2);
      X.arc(cx-26, cy+8, 17, 0, Math.PI*2);
      X.fill();
    }
    // 星（高いところほど）
    if(progress > 0.4){
      var alpha = (progress-0.4)/0.6;
      X.fillStyle = 'rgba(255,255,255,' + (alpha*0.85) + ')';
      for(var s=0;s<40;s++){
        var sx = (s*137 % W), sy = ((s*211 + scrollY*0.05) % H);
        X.globalAlpha = alpha * (0.4 + 0.6*Math.abs(Math.sin(s*1.7 + t*1.5)));
        X.fillRect(sx, sy, 2, 2);
      }
      X.globalAlpha = 1;
    }
  }

  function drawPlatform(p){
    var y = p.y - scrollY;
    if(y < -30 || y > H+30) return;
    if(p.type === 'breakable' && p.broken) return;

    X.save();
    // 影
    X.fillStyle = 'rgba(0,0,0,.12)';
    X.beginPath(); X.ellipse(p.x+p.w/2, y+8, p.w*0.5, 5, 0, 0, Math.PI*2); X.fill();

    var body1, body2, edge;
    if(p.type === 'normal'){ body1 = '#9fe07f'; body2 = '#66bb6a'; edge = '#3f8f4a'; }
    else if(p.type === 'moving'){ body1 = '#8fd6ff'; body2 = '#42a5f5'; edge = '#1e6fb8'; }
    else { body1 = '#ffd08a'; body2 = '#ffb74d'; edge = '#d1801f'; }

    // 岩のブロック
    var g = X.createLinearGradient(0, y-10, 0, y+10);
    g.addColorStop(0, body1); g.addColorStop(1, body2);
    X.fillStyle = g;
    X.beginPath();
    if(X.roundRect) X.roundRect(p.x, y-9, p.w, 18, 7); else X.rect(p.x, y-9, p.w, 18);
    X.fill();
    X.strokeStyle = edge; X.lineWidth = 2; X.stroke();

    // 上面のハイライト
    X.fillStyle = 'rgba(255,255,255,.55)';
    X.beginPath();
    if(X.roundRect) X.roundRect(p.x+5, y-7, p.w-10, 3.5, 2); else X.rect(p.x+5, y-7, p.w-10, 3.5);
    X.fill();

    // 種類ごとの印
    if(p.type === 'moving'){
      X.fillStyle = 'rgba(255,255,255,.75)';
      X.beginPath(); X.moveTo(p.x+p.w/2-6, y-2); X.lineTo(p.x+p.w/2-1, y-6); X.lineTo(p.x+p.w/2-1, y+2); X.closePath(); X.fill();
      X.beginPath(); X.moveTo(p.x+p.w/2+6, y-2); X.lineTo(p.x+p.w/2+1, y-6); X.lineTo(p.x+p.w/2+1, y+2); X.closePath(); X.fill();
    } else if(p.type === 'breakable'){
      X.strokeStyle = 'rgba(255,255,255,.7)'; X.lineWidth = 1.8;
      X.beginPath(); X.moveTo(p.x+p.w*0.34,y-9); X.lineTo(p.x+p.w*0.42,y-1); X.lineTo(p.x+p.w*0.34,y+9); X.stroke();
      X.beginPath(); X.moveTo(p.x+p.w*0.66,y-9); X.lineTo(p.x+p.w*0.6,y-1); X.lineTo(p.x+p.w*0.68,y+9); X.stroke();
    }
    X.restore();
  }

  function drawKero(cx, cy, squash){
    X.save(); X.translate(cx, cy);
    var sq = 1 - squash*0.18, st = 1 + squash*0.14;
    X.scale(st, sq);
    var bob = Math.sin(t*6)*1.2;
    X.translate(0, bob);

    // 影
    X.fillStyle = 'rgba(0,0,0,.16)';
    X.beginPath(); X.ellipse(0, 20, 15, 4.5, 0, 0, Math.PI*2); X.fill();
    // 体
    var g = X.createLinearGradient(0,-14,0,16);
    g.addColorStop(0,'#9be36b'); g.addColorStop(1,'#4fa832');
    X.fillStyle = g;
    X.beginPath(); X.ellipse(0, 2, 16, 15, 0, 0, Math.PI*2); X.fill();
    // 腹
    X.fillStyle = 'rgba(226,255,206,.9)';
    X.beginPath(); X.ellipse(0, 6, 10, 8, 0, 0, Math.PI*2); X.fill();
    // 目の玉
    X.fillStyle = '#2e7d32';
    X.beginPath(); X.arc(-8,-10,7,0,Math.PI*2); X.fill();
    X.beginPath(); X.arc(8,-10,7,0,Math.PI*2); X.fill();
    X.fillStyle = '#fff';
    X.beginPath(); X.arc(-8,-10,5.4,0,Math.PI*2); X.fill();
    X.beginPath(); X.arc(8,-10,5.4,0,Math.PI*2); X.fill();
    // 瞳
    X.fillStyle = '#1b2a1a';
    X.beginPath(); X.arc(-7.4,-9.6,2.8,0,Math.PI*2); X.fill();
    X.beginPath(); X.arc(8.6,-9.6,2.8,0,Math.PI*2); X.fill();
    X.fillStyle = 'rgba(255,255,255,.95)';
    X.beginPath(); X.arc(-8.4,-11,1.1,0,Math.PI*2); X.fill();
    X.beginPath(); X.arc(7.6,-11,1.1,0,Math.PI*2); X.fill();
    // ほっぺ
    X.fillStyle = 'rgba(255,138,150,.55)';
    X.beginPath(); X.arc(-11,1,3.2,0,Math.PI*2); X.fill();
    X.beginPath(); X.arc(11,1,3.2,0,Math.PI*2); X.fill();
    // 口
    X.strokeStyle = '#2e6b25'; X.lineWidth = 1.8; X.lineCap = 'round';
    X.beginPath(); X.arc(0, 0, 7, 0.25*Math.PI, 0.75*Math.PI); X.stroke();
    // 脚
    X.fillStyle = '#4fa832';
    X.beginPath(); X.ellipse(-12, 13, 6, 3.6, -0.3, 0, Math.PI*2); X.fill();
    X.beginPath(); X.ellipse(12, 13, 6, 3.6, 0.3, 0, Math.PI*2); X.fill();
    X.restore();
  }

  function drawParticles(){
    for(var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      X.globalAlpha = Math.min(1, p.life/14);
      X.fillStyle = p.color;
      X.beginPath(); X.arc(p.x, p.y - scrollY, p.r, 0, Math.PI*2); X.fill();
      X.globalAlpha = 1;
    }
  }

  // ===== 更新 =====
  var lastMilestone = 0;
  function update(dt){
    t += dt;
    if(player.squash > 0) player.squash = Math.max(0, player.squash - dt*6);
    if(state !== 'play') return;

    if(moveDir){ player.x += moveDir * 5; dragDelta = 0; }
    else { var step = Math.max(-5, Math.min(5, dragDelta)); player.x += step; dragDelta -= step; }

    if(player.x < -10) player.x = W+10;
    if(player.x > W+10) player.x = -10;

    player.vy += 0.25;
    player.y += player.vy;

    var screenY = player.y - scrollY;
    if(screenY < H*0.4){
      var diff = H*0.4 - screenY;
      scrollY -= diff;
      score = Math.max(score, Math.floor(-scrollY/10));
      if(score > maxScore) maxScore = score;
      $('score').textContent = score;
      if(Math.floor(score/100) > Math.floor(lastMilestone/100) && score >= 100){
        lastMilestone = score;
        showMilestone(Math.floor(score/100)*100 + '点 到達！');
        sfx.miles();
      }
    }

    for(var i=0;i<platforms.length;i++){
      var p = platforms[i];
      if(p.type === 'moving'){
        p.x += p.dir*1.5;
        if(p.x < p.baseX-25 || p.x > p.baseX+25) p.dir *= -1;
      }
    }

    if(player.vy > 0){
      for(var i=0;i<platforms.length;i++){
        var p = platforms[i];
        if(p.broken) continue;
        var py = player.y+12, prevPy = py-player.vy;
        if(py >= p.y-4 && prevPy < p.y-4 && player.x > p.x-10 && player.x < p.x+p.w+10){
          lesson = ['左右移動を学ぼう','青い足場を待とう','橙は一度だけ。次へ！'][p.phase||0];
          $('lesson').textContent = lesson;
          if(p.type === 'breakable'){
            p.broken = true; jump(); sfx.crack();
            for(var k=0;k<6;k++){
              particles.push({ x: p.x+p.w/2, y: p.y, vx:(Math.random()-.5)*4, vy: Math.random()*3,
                life:15, r:3, color:'#ffb74d' });
            }
          } else { jump(); }
          break;
        }
      }
    }

    for(var i=platforms.length-1;i>=0;i--){ if(platforms[i].y-scrollY > H+50) platforms.splice(i,1); }
    var highest = Infinity;
    for(var i=0;i<platforms.length;i++){ if(platforms[i].y < highest) highest = platforms[i].y; }
    while(highest > scrollY - H*0.5){ highest -= GAP; addPlatform(highest); }

    if(player.y - scrollY > H+50) gameOver();
  }

  function showMilestone(text){
    var el = $('milestone');
    el.textContent = text;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }

  function gameOver(){
    state = 'over';
    sfx.fall();
    var isNew = false;
    if(score > best){ best = score; isNew = true;
      try{ localStorage.setItem(BEST_KEY, best); }catch(e){} }
    $('best').textContent = best > 0 ? ('🏆 ' + best) : '🏆 --';

    var rank;
    if(score >= 800) rank = '🏆 空中遺跡の征服者！';
    else if(score >= 500) rank = '⭐ 空を駆けるカエル！';
    else if(score >= 300) rank = '👍 なかなかやるね！';
    else if(score >= 150) rank = '😊 いい感じ！';
    else rank = '💪 もう一回いこう！';

    $('ov-score').textContent = score;
    $('ov-best').textContent = best;
    $('ov-max').textContent = maxScore;
    $('ov-rank').textContent = rank;
    $('ov-rank').classList.remove('pop');
    $('newbest').classList.toggle('show', isNew);
    setTimeout(function(){
      $('over').classList.add('show');
      $('ov-rank').classList.add('pop');
    }, 420);
  }

  function render(){
    X.clearRect(0,0,W,H);
    drawBg();
    if(state !== 'menu'){
      for(var i=0;i<platforms.length;i++) drawPlatform(platforms[i]);
      drawParticles();
      drawKero(player.x, player.y - scrollY, player.squash);
    } else {
      var fy = Math.sin(t*1.8)*10;
      drawKero(W/2, H*0.42 + fy, 0);
    }
  }

  function start(){
    audio();
    $('menu').classList.remove('show');
    $('over').classList.remove('show');
    lastMilestone = 0;
    reset();
    state = 'play';
  }
  $('go').addEventListener('click', start);
  $('retry').addEventListener('click', start);

  // ===== ループ =====
  var last = performance.now();
  function loop(now){
    var dt = Math.min(0.05, (now-last)/1000); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  function fit(){
    var pad = 16;
    var r = Math.min((window.innerWidth-pad*2)/W, (window.innerHeight-pad*2)/H);
    cv.style.width = Math.floor(W*r)+'px';
    cv.style.height = Math.floor(H*r)+'px';
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit,120); });

  reset();
  state = 'menu';
  requestAnimationFrame(function(n){ last = n; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
